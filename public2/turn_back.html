<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Turn Back</title>
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0a0c0f;
      --text: #e8eaf0;
      --red: #d92d20;
      --red-glow: rgba(217, 45, 32, 0.4);
      --green: #12b76a;
      --green-glow: rgba(18, 183, 106, 0.4);
      --dim: #6b7280;
      --mono: 'Share Tech Mono', monospace;
      --display: 'Orbitron', sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: var(--bg);
      color: var(--text);
      font-family: var(--mono);
      overflow: hidden;
      position: relative;
    }

    /* Scanline overlay */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: repeating-linear-gradient(
        0deg,
        transparent,
        transparent 2px,
        rgba(0,0,0,0.08) 2px,
        rgba(0,0,0,0.08) 4px
      );
      pointer-events: none;
      z-index: 100;
    }

    /* Noise grain */
    body::after {
      content: '';
      position: fixed;
      inset: -50%;
      width: 200%;
      height: 200%;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
      opacity: 0.35;
      pointer-events: none;
      z-index: 99;
      animation: grain 0.5s steps(1) infinite;
    }

    @keyframes grain {
      0%, 100% { transform: translate(0, 0); }
      10% { transform: translate(-2%, -3%); }
      20% { transform: translate(3%, 2%); }
      30% { transform: translate(-1%, 4%); }
      40% { transform: translate(4%, -1%); }
      50% { transform: translate(-3%, 3%); }
      60% { transform: translate(2%, -4%); }
      70% { transform: translate(-4%, 1%); }
      80% { transform: translate(1%, -2%); }
      90% { transform: translate(3%, 4%); }
    }

    /* ── PAGES ── */
    .page {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 2rem;
      transition: opacity 0.5s ease, transform 0.5s ease;
    }

    .page.hidden {
      opacity: 0;
      pointer-events: none;
      transform: scale(0.97);
    }

    /* ── HOME PAGE ── */
    #home .container { text-align: center; }

    #home h1 {
      font-family: var(--display);
      font-size: clamp(3rem, 10vw, 7rem);
      font-weight: 900;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      animation: flicker 6s infinite;
    }

    @keyframes flicker {
      0%, 95%, 100% { opacity: 1; }
      96% { opacity: 0.7; }
      97% { opacity: 1; }
      98% { opacity: 0.5; }
      99% { opacity: 1; }
    }

    #home h3 {
      margin: 0.5rem 0 2.5rem;
      font-size: clamp(0.85rem, 2vw, 1.1rem);
      color: var(--dim);
      letter-spacing: 0.3em;
      text-transform: uppercase;
    }

    .buttons {
      display: flex;
      justify-content: center;
      gap: 1.2rem;
      flex-wrap: wrap;
    }

    button {
      border: none;
      border-radius: 4px;
      padding: 0.9rem 2rem;
      min-width: 190px;
      color: white;
      font-family: var(--mono);
      font-size: 0.9rem;
      font-weight: 700;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
      position: relative;
      overflow: hidden;
    }

    button::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(255,255,255,0.08) 0%, transparent 60%);
    }

    button:hover { transform: translateY(-3px); }

    .btn-hardcore {
      background: #1a0a09;
      border: 1px solid var(--red);
      color: var(--red);
      box-shadow: 0 0 18px var(--red-glow), inset 0 0 12px rgba(217,45,32,0.05);
    }
    .btn-hardcore:hover {
      box-shadow: 0 0 32px var(--red-glow), inset 0 0 20px rgba(217,45,32,0.1);
    }



    .btn-easy {
      background: #0d1520;
      border: 1px solid #3b82f6;
      color: #3b82f6;
      box-shadow: 0 0 18px rgba(59,130,246,0.35), inset 0 0 12px rgba(59,130,246,0.05);
    }
    .btn-easy:hover {
      box-shadow: 0 0 32px rgba(59,130,246,0.5), inset 0 0 20px rgba(59,130,246,0.1);
    }

    /* ── FLAG PAGE ── */
    #flag-page .container {
      text-align: center;
      width: 100%;
      max-width: 540px;
    }

    #flag-page h1 {
      font-family: var(--display);
      font-size: clamp(2rem, 7vw, 4.5rem);
      font-weight: 900;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--red);
      text-shadow: 0 0 30px var(--red-glow);
      animation: flicker 6s infinite;
      margin-bottom: 0.3rem;
    }

    .badge {
      display: inline-block;
      font-size: 0.7rem;
      letter-spacing: 0.35em;
      text-transform: uppercase;
      color: var(--red);
      border: 1px solid var(--red);
      padding: 0.2rem 0.8rem;
      border-radius: 2px;
      margin-bottom: 2.5rem;
      opacity: 0.7;
    }

    .flag-label {
      font-size: 0.75rem;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: var(--dim);
      margin-bottom: 0.6rem;
      text-align: left;
    }

    .input-wrap {
      position: relative;
      margin-bottom: 1rem;
    }

    .input-wrap::before {
      content: '>';
      position: absolute;
      left: 1rem;
      top: 50%;
      transform: translateY(-50%);
      color: var(--red);
      font-size: 1rem;
      pointer-events: none;
    }

    #flag-input {
      width: 100%;
      background: #0f1115;
      border: 1px solid #2a2d35;
      border-radius: 4px;
      color: var(--text);
      font-family: var(--mono);
      font-size: 0.95rem;
      padding: 0.85rem 1rem 0.85rem 2.2rem;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
      letter-spacing: 0.05em;
    }

    #flag-input:focus {
      border-color: var(--red);
      box-shadow: 0 0 14px var(--red-glow);
    }

    #flag-input.success {
      border-color: var(--green);
      box-shadow: 0 0 14px var(--green-glow);
    }

    #flag-input.error {
      border-color: var(--red);
      animation: shake 0.35s ease;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-6px); }
      40% { transform: translateX(6px); }
      60% { transform: translateX(-4px); }
      80% { transform: translateX(4px); }
    }

    .btn-submit {
      width: 100%;
      background: #1a0a09;
      border: 1px solid var(--red);
      color: var(--red);
      box-shadow: 0 0 14px var(--red-glow);
      font-size: 0.85rem;
      letter-spacing: 0.25em;
      padding: 0.85rem;
    }
    .btn-submit:hover {
      box-shadow: 0 0 28px var(--red-glow);
    }

    .feedback {
      margin-top: 1.2rem;
      font-size: 0.85rem;
      letter-spacing: 0.1em;
      min-height: 1.2em;
      transition: opacity 0.3s;
    }

    .feedback.success {
      color: var(--green);
      text-shadow: 0 0 10px var(--green-glow);
    }

    .feedback.error {
      color: var(--red);
      text-shadow: 0 0 10px var(--red-glow);
    }

    .back-link {
      display: inline-block;
      margin-top: 2rem;
      font-size: 0.75rem;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: var(--dim);
      cursor: pointer;
      border: none;
      background: none;
      min-width: unset;
      padding: 0;
      box-shadow: none;
      transition: color 0.2s;
    }
    .back-link:hover {
      color: var(--text);
      transform: none;
    }

    /* ── Success overlay ── */
    #success-overlay {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      background: rgba(0,0,0,0.85);
      z-index: 200;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s;
      text-align: center;
      padding: 2rem;
    }

    #success-overlay.visible {
      opacity: 1;
      pointer-events: all;
    }

    #success-overlay h2 {
      font-family: var(--display);
      font-size: clamp(2rem, 6vw, 4rem);
      color: var(--green);
      text-shadow: 0 0 40px var(--green-glow);
      letter-spacing: 0.1em;
      margin-bottom: 1rem;
      animation: pulse-green 2s ease infinite;
    }

    @keyframes pulse-green {
      0%, 100% { text-shadow: 0 0 20px var(--green-glow); }
      50% { text-shadow: 0 0 50px rgba(18,183,106,0.8); }
    }

    #success-overlay p {
      color: var(--dim);
      font-size: 0.9rem;
      letter-spacing: 0.15em;
      margin-bottom: 2rem;
    }

    .btn-close-success {
      background: #071a10;
      border: 1px solid var(--green);
      color: var(--green);
      box-shadow: 0 0 14px var(--green-glow);
      font-size: 0.8rem;
      letter-spacing: 0.2em;
      min-width: 160px;
    }
    .btn-close-success:hover {
      box-shadow: 0 0 28px var(--green-glow);
    }
  </style>
</head>
<body>

  <!-- HOME PAGE -->
  <div class="page" id="home">
    <main class="container">
      <h1>Turn Back</h1>
      <h3>Choose a difficulty</h3>
      <div class="buttons">
        <button class="btn-hardcore" onclick="goToFlag()">Hardcore Mode</button>
        <button class="btn-easy" onclick="goToEasy()">Easy</button>

      </div>
    </main>
  </div>

  <!-- EASY PAGE -->
  <div class="page hidden" id="easy-page">
    <div class="container" style="max-width:600px;width:100%;text-align:center;">
      <h1 style="font-family:var(--display);font-size:clamp(2rem,7vw,4rem);font-weight:900;letter-spacing:0.12em;text-transform:uppercase;color:#3b82f6;text-shadow:0 0 30px rgba(59,130,246,0.5);animation:flicker 6s infinite;margin-bottom:0.3rem;">Turn Back</h1>
      <span class="badge" style="color:#3b82f6;border-color:#3b82f6;margin-bottom:2rem;">Easy Mode</span>

      <div id="easy-questions"></div>

      <button class="btn-submit" style="border-color:#3b82f6;color:#3b82f6;box-shadow:0 0 14px rgba(59,130,246,0.4);margin-top:1rem;" onclick="checkEasy()">Submit All Flags</button>
      <div class="feedback" id="easy-feedback"></div>
      <button class="back-link" onclick="goHome()" style="margin-top:1.5rem;">← Back to menu</button>
    </div>
  </div>

  <!-- FLAG PAGE -->
  <div class="page hidden" id="flag-page">
    <div class="container">
      <h1>Turn Back</h1>
      <span class="badge">Hardcore Mode</span>

      <div class="flag-label">Submit Root Flag</div>

      <div class="input-wrap">
        <input
          type="text"
          id="flag-input"
          placeholder="Enter flag here..."
          autocomplete="off"
          spellcheck="false"
          onkeydown="if(event.key==='Enter') checkFlag()"
        />
      </div>

      <button class="button btn-submit" onclick="checkFlag()">Submit Flag</button>

      <div class="feedback" id="feedback"></div>

      <button class="back-link" onclick="goHome()">← Back to menu</button>
    </div>
  </div>

  <!-- SUCCESS OVERLAY -->
  <div id="success-overlay">
    <div>
      <h2>🎉 Congratulations!</h2>
      <p>Root flag accepted. You've conquered Hardcore Mode.</p>
      <button class="button btn-close-success" onclick="closeSuccess()">Continue</button>
    </div>
  </div>

  <script>
    const ROOT_FLAG = 'vi41TWShrubXN8QdptzQk2j8';

    const EASY_QUESTIONS = [
      { q: '¿Cual es la user.txt flag para backup?',    a: 'ydcwpivuwxcg5voacvwaltlr' },
      { q: '¿Cual es la user.txt flag para developer?', a: 'lahzgco7ue98u0e6dlcd2six' },
      { q: '¿Cual es la user.txt flag para ftpuser?',   a: 'aezakynagk9i0zxevgc5848v' },
      { q: '¿Cual es la user.txt flag para manager?',   a: 'c01l15dl0kgl85s3myhj9g4o' },
      { q: '¿Cual es la user.txt flag para soporte?',   a: 'ers7p4q929uff4cma10t6aui' },
      { q: '¿Cual es la user.txt flag para usuario?',   a: '2p2o4ycmm38nm5of4grzohf6' },
      { q: '¿Cual es la root_flag.txt flag de Jordan?', a: 'vi41TWShrubXN8QdptzQk2j8' },
    ];

    // Build easy questions HTML
    (function buildEasy() {
      const container = document.getElementById('easy-questions');
      EASY_QUESTIONS.forEach((item, i) => {
        container.innerHTML += `
          <div style="margin-bottom:1.2rem;text-align:left;">
            <div class="flag-label" style="margin-bottom:0.4rem;">${item.q}</div>
            <div style="display:flex;gap:0.6rem;align-items:center;">
              <div class="input-wrap" style="margin-bottom:0;flex:1;">
                <input type="text" id="easy-input-${i}" placeholder="Enter flag..." autocomplete="off" spellcheck="false"
                  style="width:100%;background:#0f1115;border:1px solid #2a2d35;border-radius:4px;color:var(--text);font-family:var(--mono);font-size:0.9rem;padding:0.75rem 1rem 0.75rem 2.2rem;outline:none;transition:border-color 0.2s,box-shadow 0.2s;"
                  onkeydown="if(event.key==='Enter') checkSingle(${i})"
                />
              </div>
              <button onclick="checkSingle(${i})"
                style="background:#1a0a09;border:1px solid #3b82f6;color:#3b82f6;box-shadow:0 0 10px rgba(59,130,246,0.3);font-size:0.75rem;letter-spacing:0.15em;padding:0.75rem 1rem;min-width:unset;white-space:nowrap;border-radius:4px;">
                Submit
              </button>
            </div>
            <div id="easy-fb-${i}" style="font-size:0.75rem;letter-spacing:0.1em;min-height:1em;margin-top:0.3rem;"></div>
          </div>`;
      });
    })();

    function goToEasy() {
      document.getElementById('home').classList.add('hidden');
      document.getElementById('easy-page').classList.remove('hidden');
      document.getElementById('easy-input-0').focus();
    }

    function checkSingle(i) {
      const input = document.getElementById(`easy-input-${i}`);
      const fb    = document.getElementById(`easy-fb-${i}`);
      const val   = input.value.trim();
      input.style.borderColor = '';
      input.style.boxShadow   = '';
      fb.textContent = '';

      if (!val) {
        input.style.borderColor = 'var(--red)';
        fb.style.color          = 'var(--red)';
        fb.textContent          = '✘ This field is empty';
        return;
      }

      if (val === EASY_QUESTIONS[i].a) {
        input.style.borderColor = 'var(--green)';
        input.style.boxShadow   = '0 0 10px var(--green-glow)';
        fb.style.color          = 'var(--green)';
        fb.textContent          = '✔ Correct';
      } else {
        input.style.borderColor = 'var(--red)';
        input.style.boxShadow   = '0 0 10px var(--red-glow)';
        fb.style.color          = 'var(--red)';
        fb.textContent          = '✘ Try again';
      }
    }

    function checkEasy() {
      let allCorrect = true;
      EASY_QUESTIONS.forEach((item, i) => {
        const input = document.getElementById(`easy-input-${i}`);
        const fb    = document.getElementById(`easy-fb-${i}`);
        const val   = input.value.trim();
        input.style.borderColor = '';
        input.style.boxShadow   = '';
        fb.textContent = '';

        if (val === item.a) {
          input.style.borderColor = 'var(--green)';
          input.style.boxShadow   = '0 0 10px var(--green-glow)';
          fb.style.color          = 'var(--green)';
          fb.textContent          = '✔ Correct';
        } else {
          allCorrect = false;
          input.style.borderColor = 'var(--red)';
          input.style.boxShadow   = '0 0 10px var(--red-glow)';
          fb.style.color          = 'var(--red)';
          fb.textContent          = val ? '✘ Try again' : '✘ This field is empty';
        }
      });

      const globalFb = document.getElementById('easy-feedback');
      if (allCorrect) {
        globalFb.className   = 'feedback success';
        globalFb.textContent = '🎉 All flags correct! You completed Easy Mode.';
      } else {
        globalFb.className   = 'feedback error';
        globalFb.textContent = 'Some flags are incorrect. Keep trying!';
      }
    }

    function goToFlag() {
      document.getElementById('home').classList.add('hidden');
      document.getElementById('flag-page').classList.remove('hidden');
      setTimeout(() => document.getElementById('flag-input').focus(), 500);
    }

    function goHome() {
      document.getElementById('flag-page').classList.add('hidden');
      document.getElementById('easy-page').classList.add('hidden');
      document.getElementById('home').classList.remove('hidden');
      resetInput();
    }

    function checkFlag() {
      const input = document.getElementById('flag-input');
      const feedback = document.getElementById('feedback');
      const val = input.value.trim();

      input.classList.remove('success', 'error');
      feedback.className = 'feedback';
      feedback.textContent = '';

      if (!val) return;

      if (val === ROOT_FLAG) {
        input.classList.add('success');
        feedback.classList.add('success');
        feedback.textContent = '✔ Flag accepted!';
        setTimeout(() => {
          document.getElementById('success-overlay').classList.add('visible');
        }, 400);
      } else {
        input.classList.add('error');
        feedback.classList.add('error');
        feedback.textContent = '✘ Try again — that flag is incorrect.';
        void input.offsetWidth; // reflow for shake restart
      }
    }

    function closeSuccess() {
      document.getElementById('success-overlay').classList.remove('visible');
      resetInput();
      goHome();
    }

    function resetInput() {
      const input = document.getElementById('flag-input');
      input.value = '';
      input.classList.remove('success', 'error');
      document.getElementById('feedback').textContent = '';
      document.getElementById('feedback').className = 'feedback';
    }
  </script>
</body>
</html>
